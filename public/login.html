<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Masuk ke PDF2AI." />
    <title>Masuk — PDF2AI</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/login.js" type="module"></script>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <div class="login-brand">
          <span class="brand-mark" aria-hidden="true">P2</span>
          <div class="brand-copy">
            <strong>PDF2AI</strong>
            <small>PDF to AI Ready</small>
          </div>
        </div>

        <div class="login-heading">
          <p class="eyebrow">AKSES TOTP</p>
          <h1 id="login-title">Selamat datang.</h1>
          <p>Masukkan kode dari aplikasi authenticator untuk membuka dashboard.</p>
        </div>

        <form id="login-form">
          <label class="password-field otp-field" for="code">
            <span>Kode TOTP</span>
            <input
              id="code"
              name="code"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              pattern="[0-9]{6}"
              maxlength="6"
              placeholder="000000"
              required
              autofocus
            />
          </label>
          <p class="login-error" id="login-error" role="alert" hidden></p>
          <button
            class="primary-button login-button"
            id="login-button"
            type="submit"
          >
            <span id="login-button-label">Masuk ke PDF2AI</span>
            <span aria-hidden="true">→</span>
          </button>
        </form>

        <p class="login-security-note">
          Kode diperbarui otomatis setiap 30 detik.
        </p>
      </section>
    </main>
  </body>
</html>
